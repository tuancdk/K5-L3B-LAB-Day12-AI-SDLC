<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Quán Ăn Chợ Nổi</title>
<style>
  :root {
    color-scheme: light;
    --paper: #f7efdd;
    --canvas: #3d5850;
    --ink: #263328;
    --muted: #596251;
    --line: #dbccb0;
    --accent: #276753;
    --panel: #fff8e9;
    --halo: #e5ecd9;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at 18% 0%, #fff8e9 0%, transparent 52%), var(--paper);
    color: var(--ink);
    font: 15px/1.45 system-ui, sans-serif;
  }
  body[data-mode="quan"] {
    color-scheme: dark;
    --paper: #102433;
    --ink: #fff6df;
    --muted: #d1dcdf;
    --line: #456778;
    --accent: #ffd478;
    --panel: #203d4d;
    --halo: #2c5462;
    background: radial-gradient(ellipse at 18% 0%, #255366 0%, transparent 64%), var(--paper);
  }
  body[data-mode="quan"] h1 { text-shadow: 0 3px #152d39; }
  body[data-mode="quan"] .meter, body[data-mode="quan"] .guide, body[data-mode="quan"] .journal {
    border: 2px solid var(--line); box-shadow: 0 3px #0b202d;
  }
  body[data-mode="quan"] .meter { border-top-color: #688798; }
  body[data-mode="quan"] main { max-width: 1320px; padding-top: 14px; }
  body[data-mode="quan"] header { margin-bottom: 12px; }
  body[data-mode="quan"] h1 { font-size: clamp(1.55rem, 3.3vw, 2.4rem); }
  body[data-mode="quan"] .dashboard { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; }
  body[data-mode="quan"] .layout { grid-template-columns: minmax(0, 1fr); gap: 10px; margin-top: 10px; }
  body[data-mode="quan"] .meters { grid-template-columns: repeat(3, minmax(78px, auto)); gap: 5px; }
  body[data-mode="quan"] .meter { padding: 8px 12px; }
  body[data-mode="quan"] .meter--clock { background: #fff0bf; border-color: #d8a864; }
  body[data-mode="quan"] .meter--clock :is(.label,.value,.meter-icon) { color: #432b2a; }
  body[data-mode="quan"] .meter--urgent { background: #ffc1a3; border-color: #ec9077; }
  body[data-mode="quan"] aside { grid-template-columns: auto minmax(0,1fr); }
  body[data-mode="quan"] .guide-top { margin: 0; }
  body[data-mode="quan"] #portrait { width: 38px; height: 38px; }
  body[data-mode="quan"] .journal { display: grid; grid-template-columns: minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr); gap: 10px; }
  body[data-mode="quan"] .journal section + section { margin: 0; padding: 0 0 0 10px; border: 0; border-inline-start: 1px solid var(--line); }
  body[data-mode="quan"] .guide { display: flex; align-items: center; }
  body[data-mode="quan"] .guide :is(.eyebrow,.guide-sub) { display: none; }
  body[data-mode="quan"] #restart { background: #ffd478; color: #28372e; border: 2px solid #876046; box-shadow: 0 3px #102433; }
  body[data-mode="quan"] #restart kbd { background: #fff0be; color: #28372e; border-color: #b88750; }
  body[data-mode="quan"] #restart:hover { background: #ffe4a0; }
  main { max-width: 1510px; padding: 22px clamp(14px, 3.2vw, 48px) 24px; margin: auto; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
  .eyebrow { margin: 0 0 4px; color: var(--accent); font-size: .72rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
  h1, h2 { font-family: Georgia, "Times New Roman", serif; line-height: 1.13; }
  h1 { margin: 0; font-size: clamp(1.74rem, 4.1vw, 3rem); letter-spacing: -.035em; }
  button, kbd { background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 6px; }
  button { padding: 7px 11px; cursor: pointer; font: 700 .83rem system-ui, sans-serif; white-space: nowrap; }
  button:hover, button.active { background: var(--halo); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  kbd { padding: 2px 5px; font: 700 .74rem system-ui, sans-serif; }
  .meters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .meter { display: grid; align-content: center; gap: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 9px 13px; min-width: 0; }
  .meter-title { display: flex; align-items: center; gap: 7px; }
  .meter-icon { color: var(--accent); font-size: .94rem; line-height: 1; }
  .label { color: var(--muted); font-size: .72rem; font-weight: 780; letter-spacing: .055em; text-transform: uppercase; }
  .value { display: block; color: var(--ink); font-size: clamp(1rem, 2vw, 1.35rem); font-weight: 800; font-variant-numeric: tabular-nums; }
  .track { height: 4px; border-radius: 4px; overflow: hidden; background: var(--halo); }
  .fill { display: block; height: 100%; background: var(--accent); }
  .warn { background: #da7059; }
  .layout { display: grid; align-items: start; grid-template-columns: minmax(0, 1fr) minmax(220px, 23%); gap: 14px; margin-top: 12px; }
  .stage { position: relative; overflow: hidden; isolation: isolate; border-radius: 13px; background: var(--canvas); border: 1px solid #233e37; box-shadow: 0 8px 24px #1e291723; }
  body[data-mode="quan"] .stage { border: 3px solid #4a7380; box-shadow: 0 5px #0b1d28; }
  body[data-mode="quan"] .scene-key { background: #193845; }
  #scene { width: 100%; display: block; aspect-ratio: 2.06 / 1; }
  @media (min-width: 761px) {
    body[data-mode="quan"] #scene { aspect-ratio: 2.55 / 1; }
  }
  .scene-key { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 3px 12px; padding: 7px 12px; background: #202c27; color: #f2e5c7; font-size: .74rem; }
  .scene-key span:before { content: "◆"; color: #e4b869; margin-right: 6px; font-size: .58rem; }
  .message { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: max-content; max-width: 94%; padding: 8px 12px; border-radius: 7px; background: #222721; color: #fff0d1; border: 1px solid #edd095; text-align: center; }
  aside { display: grid; gap: 9px; }
  .guide, .journal { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow-wrap: anywhere; }
  .guide { padding: 11px 12px 12px; }
  .guide-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  #portrait { width: 56px; height: 56px; flex: none; border-radius: 50%; background: var(--halo); border: 1px solid var(--line); }
  .guide h2 { margin: 2px 0 0; font-size: 1.28rem; }
  .guide p { margin: 0; }
  .guide-sub { font-size: .83rem; color: var(--muted); }
  .journal { padding: 11px 13px; }
  .journal h2 { font: 750 .95rem/1.25 system-ui, sans-serif; margin: 0 0 5px; color: var(--accent); }
  .journal section + section { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
  .journal p { margin: 0; }
  .journal ul { list-style: none; padding: 0; margin: 0; }
  .journal li + li { margin-top: 6px; }
  .detail { margin-top: 2px; color: var(--muted); font-size: .82rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { padding: 2px 7px; background: var(--halo); border-radius: 12px; font-size: .78rem; }
  .chips li + li { margin-top: 0; }
  .order-board { padding: 0; }
  .order-board h2 { margin: 0 0 6px 1px; color: var(--accent); font: 800 .72rem/1.2 system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase; }
  .orders { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 209px), 1fr)); gap: 6px; margin: 0; list-style: none; padding: 0; }
  .orders-empty { padding: 3px 2px; margin: 0; color: var(--muted); font-size: .86rem; }
  .ticket { display: grid; grid-template-columns: 38px minmax(0,1fr); align-items: center; gap: 7px; padding: 6px 8px; background: #fff4d2; color: #263b3d; border: 2px solid #d5ac62; border-radius: 8px; box-shadow: 0 2px #071f28; }
  .ticket.urgent { background: #ffdfc7; border-color: #d17057; }
  .ticket.eating { background: #e5f4cb; border-color: #89ab63; }
  .ticket canvas { width: 38px; height: 38px; background: #f3daa0; border-radius: 50%; }
  .ticket-info { min-width: 0; display: grid; gap: 2px; }
  .ticket strong { overflow-wrap: anywhere; font-size: .87rem; }
  .ticket-meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0 7px; color: #495753; font-size: .72rem; font-weight: 750; font-variant-numeric: tabular-nums; }
  .ticket .track { background: #ded4b4; margin-top: 1px; }
  .ticket .fill { background: #4f8758; }
  .ticket.urgent .fill { background: #c35843; }
  .scene-action { display: flex; align-items: center; gap: 9px; padding: 6px 10px; min-height: 42px; background: #162f3e; border-top: 2px solid #446675; }
  .scene-action strong { flex: none; border-radius: 6px; background: #fae4ab; color: #3a2c29; padding: 3px 8px; font-size: .73rem; }
  .scene-action p { margin: 0; font-size: .83rem; color: #fff4da; }
  body[data-mode="quan"] .controls { margin-top: 8px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 17px; margin-top: 12px; color: var(--muted); font-size: .82rem; }
  .touch-controls { display: none; gap: 10px; margin-top: 10px; justify-content: space-between; align-items: center; }
  .direction-pad { display: grid; grid-template-columns: repeat(3, 43px); gap: 4px; }
  .direction-pad button:first-child { grid-column: 2; }
  .direction-pad button:nth-child(2) { grid-column: 1; }
  .touch-actions { display: flex; flex-wrap: wrap; justify-content: end; gap: 5px; }
  .touch-controls button { min-height: 42px; touch-action: none; user-select: none; }
  @media (pointer: coarse), (max-width: 600px) {
    .touch-controls { display: flex; }
    .controls { display: none; }
  }
  @media (max-width: 760px) {
    main { padding-top: 12px; }
    header { margin-bottom: 10px; }
    .layout { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .meter { padding: 7px 8px; }
    #scene { aspect-ratio: 1.33 / 1; }
    .guide-top { margin-bottom: 4px; }
    #portrait { width: 44px; height: 44px; }
  }
  @media (max-width: 600px) {
    body[data-mode="quan"] .dashboard { grid-template-columns: minmax(0,1fr); }
    body[data-mode="quan"] .meters { grid-template-columns: repeat(3,minmax(0,1fr)); }
    body[data-mode="quan"] .meter { padding: 6px 8px; }
    body[data-mode="quan"] aside { grid-template-columns: minmax(0,1fr); }
    body[data-mode="quan"] .guide { display: none; }
  }
  @media (max-width: 430px) {
    body[data-mode="quan"] .journal { grid-template-columns: 1fr 1fr; }
    body[data-mode="quan"] .journal section:first-child { grid-column: 1 / -1; }
    body[data-mode="quan"] .journal section:nth-child(2) { padding-left: 0; border: 0; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div><p class="eyebrow" id="phase">Chợ nổi miền Tây</p><h1>Quán Ăn Chợ Nổi</h1></div>
    <button type="button" id="restart" aria-keyshortcuts="R">↻ Chơi lại <kbd>R</kbd></button>
  </header>
  <div class="dashboard">
    <section class="order-board" id="order-board" aria-labelledby="order-heading" hidden>
      <h2 id="order-heading">Đơn trên bàn</h2>
      <div id="orders"></div>
    </section>
    <div class="meters" id="meters" aria-label="Chỉ số của lượt chơi"></div>
  </div>
  <div class="layout">
    <div>
      <div class="stage">
        <canvas id="scene" aria-label="Cảnh chơi của Út Sen"></canvas>
        <div class="message" id="message" role="status">Đang kết nối…</div>
        <div class="scene-key" id="legend"></div>
        <div class="scene-action" id="scene-action" hidden>
          <strong id="action-tag" aria-live="polite">Gợi ý</strong>
          <p id="action-tip"></p>
        </div>
      </div>
      <div class="controls" aria-label="Phím điều khiển">
        <span><kbd>WASD</kbd> / <kbd>↑ ↓ ← →</kbd> Di chuyển</span>
        <span><kbd>E</kbd> <span id="interact-label">Tương tác</span></span>
        <span id="catch-key"><kbd>Space</kbd> Bắt cá</span>
      </div>
      <div class="touch-controls" aria-label="Điều khiển trên màn hình">
        <div class="direction-pad">
          <button type="button" data-input="arrowup" aria-label="Lên">↑</button>
          <button type="button" data-input="arrowleft" aria-label="Trái">←</button>
          <button type="button" data-input="arrowdown" aria-label="Xuống">↓</button>
          <button type="button" data-input="arrowright" aria-label="Phải">→</button>
        </div>
        <div class="touch-actions">
          <button type="button" id="touch-interact" data-input="e">Tương tác</button>
          <button type="button" id="touch-catch" data-input=" ">Bắt cá</button>
        </div>
      </div>
    </div>
    <aside aria-label="Hướng dẫn và vật phẩm">
      <div class="guide">
        <div class="guide-top">
          <canvas id="portrait" width="128" height="128" aria-hidden="true"></canvas>
          <div><p class="eyebrow">Bạn đang chơi</p><h2>Út Sen</h2></div>
        </div>
        <p class="guide-sub" id="tip">Đang tải hướng dẫn…</p>
      </div>
      <div class="journal" id="journal" aria-label="Giỏ và tình trạng quán"></div>
    </aside>
  </div>
</main>
<script>
"use strict";

const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");
const elements = Object.fromEntries(
  ["phase", "restart", "meters", "message", "legend", "interact-label", "catch-key", "journal",
    "tip", "touch-interact", "touch-catch", "portrait", "order-board", "orders", "scene-action",
    "action-tag", "action-tip"]
    .map(id => [id, document.getElementById(id)])
);
const object = value => value !== null && typeof value === "object" && !Array.isArray(value);
const number = Number.isFinite;
const string = value => typeof value === "string" && value.trim() !== "";
const point = value => Array.isArray(value) && value.length === 2 && value.every(number);
const range = value => point(value) && value[0] < value[1] && number(value[1] - value[0]);
const records = value => Array.isArray(value) ? value.filter(object) : [];
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
const validMode = mode => mode === "gather" || mode === "quan";
// live.py chạy 60 Hz. meta hiện chỉ chứa tuning[mode], không có tuning.tick_hz.
const tickHz = meta => number(meta.tick_hz) && meta.tick_hz > 0 ? meta.tick_hz : 60;
const seconds = (ticks, hz) => Math.ceil(Math.max(0, ticks) / hz);
const time = (ticks, hz) => {
  if (!number(ticks)) return "—";
  const s = seconds(ticks, hz);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
};
const ingredients = new Map([
  ["ca_loc", "Cá lóc"], ["ca_linh", "Cá linh"], ["ca_keo", "Cá kèo"],
  ["bong_dien_dien", "Bông điên điển"], ["bong_sung", "Bông súng"], ["keo_neo", "Kèo nèo"]
]);
const dishes = new Map([
  ["ca_loc_nuong_trui", "Cá lóc nướng trui"], ["goi_bong_sung", "Gỏi bông súng"],
  ["lau_ca_linh_dien_dien", "Lẩu cá linh điên điển"]
]);
function dishId(value) {
  if (string(value)) return value;
  if (!object(value)) return null;
  if (string(value.dish_id)) return value.dish_id;
  if (string(value.dish)) return value.dish;
  return null;
}
const dishName = value => dishes.get(value) ?? value;
const stoveLabel = new Map([["idle", "Bếp trống"], ["cooking", "Đang nấu"], ["ready", "Đã chín"], ["burnt", "Đã khét"]]);

// Gửi từng trạng thái theo thứ tự, kể cả bấm/nhả xảy ra giữa hai tick.
const keys = new Set();
const touches = new Map();
const touchButtons = document.querySelectorAll("[data-input]");
const moves = new Map([
  ["w", "up"], ["arrowup", "up"], ["s", "down"], ["arrowdown", "down"],
  ["a", "left"], ["arrowleft", "left"], ["d", "right"], ["arrowright", "right"]
]);
let snapshot = null;
let mode = null;
let offline = false;
let pending = [];
let sending = false;
let sent = "";
function input() {
  const held = new Set([...keys, ...touches.values()]);
  const directions = new Set([...held].map(key => moves.get(key)));
  const x = Number(directions.has("right")) - Number(directions.has("left"));
  const y = Number(directions.has("down")) - Number(directions.has("up"));
  return { move: [x, mode === "quan" ? -y : y], interact: held.has("e"), catch: held.has(" ") };
}
function sendKeys() {
  if (!mode) return;
  const body = JSON.stringify(input());
  if (body === sent) return;
  sent = body;
  pending.push({ path: "/input", body });
  void send();
}
async function send() {
  if (sending) return;
  sending = true;
  try {
    while (pending.length) {
      const { path, body } = pending.shift();
      const response = await fetch(path, {
        method: "POST", body, headers: { "Content-Type": "application/json" },
        signal: AbortSignal.timeout(2000)
      });
      if (!response.ok) throw new Error("HTTP " + response.status);
    }
  } catch {
    pending = [];
    sent = ""; // poll gửi lại trạng thái đang giữ khi kết nối hồi phục.
    offline = true;
  } finally {
    sending = false;
  }
}
function restart() {
  clearInput();
  pending = [{ path: "/restart" }];
  sent = "";
  void send();
}
function releaseKeys() {
  clearInput();
  sendKeys();
}
function clearInput() {
  keys.clear();
  touches.clear();
  for (const button of touchButtons) button.classList.remove("active");
}
function gameKey(event) {
  const key = event.key.toLowerCase();
  return moves.has(key) || key === "e" || key === " " || key === "r" ? key : null;
}
addEventListener("keydown", event => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const key = gameKey(event);
  if (!key) return;
  event.preventDefault();
  if (event.repeat) return;
  if (key === "r") restart();
  else { keys.add(key); sendKeys(); }
});
addEventListener("keyup", event => {
  if (keys.delete(event.key.toLowerCase())) sendKeys();
});
addEventListener("blur", releaseKeys);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) releaseKeys();
});
elements.restart.addEventListener("click", restart);
for (const button of touchButtons) {
  const key = button.dataset.input;
  button.addEventListener("pointerdown", event => {
    if (event.button !== 0) return;
    event.preventDefault();
    button.setPointerCapture(event.pointerId);
    touches.set(event.pointerId, key);
    button.classList.add("active");
    sendKeys();
  });
  function release(event) {
    if (!touches.delete(event.pointerId)) return;
    button.classList.toggle("active", [...touches.values()].includes(key));
    sendKeys();
  }
  for (const event of ["pointerup", "pointercancel", "lostpointercapture"]) {
    button.addEventListener(event, release);
  }
  button.addEventListener("click", event => {
    if (event.detail !== 0 || keys.has(key)) return;
    keys.add(key);
    sendKeys();
    keys.delete(key);
    sendKeys();
  });
}

const reported = new Set();
function layer(name, draw, onCanvas = false) {
  if (onCanvas) ctx.save();
  try {
    draw();
  } catch (error) {
    if (!reported.has(name)) {
      reported.add(name);
      console.warn("Không thể hiển thị " + name, error);
    }
  } finally {
    if (onCanvas) ctx.restore();
  }
}
async function poll() {
  try {
    const response = await fetch("/state", { cache: "no-store", signal: AbortSignal.timeout(2000) });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const next = await response.json();
    if (!object(next)) throw new Error("Snapshot phải là object");
    snapshot = next;
    if (validMode(next.mode)) mode = next.mode;
    offline = false;
    if (!sent) sendKeys();
  } catch {
    offline = true;
  } finally {
    layer("HUD", updateHud);
    layer("thông báo", updateMessage);
    setTimeout(poll, 33);
  }
}

function node(tag, content, className) {
  const element = document.createElement(tag);
  if (content !== undefined) element.textContent = content;
  if (className) element.className = className;
  return element;
}
function updateContent(element, parts) {
  // Chỉ cập nhật DOM nếu nội dung HUD đổi, không thay cây DOM vô điều kiện mỗi poll.
  const next = node("div");
  next.append(...parts);
  if (element.innerHTML === next.innerHTML) return false;
  element.replaceChildren(...next.childNodes);
  return true;
}
function meter(label, value, fraction, modifier = "") {
  const card = node("div", undefined, "meter" + modifier);
  const title = node("div", undefined, "meter-title");
  const icon = node("span", meterIcons.get(label) ?? "◆", "meter-icon");
  icon.setAttribute("aria-hidden", "true");
  title.append(icon, node("span", label, "label"));
  card.append(title, node("strong", value, "value"));
  if (number(fraction)) card.append(track(fraction));
  return card;
}
const meterIcons = new Map([["Thời gian", "◷"], ["Oxy", "◌"], ["Máu", "♥"], ["Tiền", "◉"], ["Uy tín", "★"]]);
function track(fraction) {
  const bar = node("div", undefined, "track");
  bar.setAttribute("aria-hidden", "true");
  const fill = node("span", undefined, fraction <= 0.25 ? "fill warn" : "fill");
  fill.style.width = clamp(fraction, 0, 1) * 100 + "%";
  bar.append(fill);
  return bar;
}
function section(title, contents) {
  const result = node("section");

    const [x,y] = pos;
    const cooking = stove.state === "cooking", ready = stove.state === "ready";
    const near = inRange(player.pos,stove.pos,meta.interact_radius);
    stationMat(x,y+6*size,size,"#60827e","#adc5a5");
    if (ready) {
      const light = ctx.createRadialGradient(x,y,5,x,y,50*size);
      light.addColorStop(0,"#ddf892e1"); light.addColorStop(1,"#ddf89200");
      rect(x-50*size,y-50*size,100*size,100*size,light);
    }
    stationBase(x,y,size,ready ? "#77966f" : "#59777d",near ? "#ffe99e" : "#91b3ad");
    oval(x,y-2*size,22*size,15*size,"#37474c");
    oval(x,y-4*size,17*size,11*size,cooking ? "#d6804b" : ready ? "#9ccc7d" : "#75898a");
    oval(x,y-5*size,14*size,8*size,"#33373b");
    const dish = dishId(stove.dish);
    if (dish && (cooking || ready)) dishArt(ctx,dish,x,y-6*size,size*.87);
    for (const dx of [-22,22]) oval(x+dx*size,y+10*size,2.2*size,2.2*size,"#efc973");
    if (cooking && !reduceMotion.matches) {
      for (let i = 0; i < 3; i++) {
        const rise = (t*14+i*8)%25;
        oval(x-6*size+i*6*size+Math.sin(t*4+i)*3,y-9*size-rise,2.8,4,"#f7e3bf72");
      }
    }
    if (string(stove.id)) label("Bếp "+stove.id,x,y+33*size);
    if (ready) pill(near ? "E · Lấy món" : "Đã chín",x,y-32*size,"#d9ed9f");
    else if (cooking && number(stove.cook_ticks_left)) {
      pill("Đang nấu · "+seconds(stove.cook_ticks_left,hz)+"s",x,y-33*size,"#ffe1a2");
    }
  }
}
function tablesSprites(tables,map,data,player,meta) {
  const size = clamp(map.s/38,.72,1.45);
  const order = object(data.hand) && string(data.hand.order_id)
    ? records(data.customers).find(customer => customer.id === data.hand.order_id && customer.state !== "eating")
    : null;
  for (const table of tables) {
    const pos = map.xy(table.pos);
    if (!pos) continue;
    const [x,y] = pos;
    const deliver = order && string(order.table_id) && order.table_id === table.id;
    stationMat(x,y+6*size,size,"#965855","#f1b680");
    if (deliver) oval(x,y+1,28*size,23*size,"#ffdc83");
    for (const [dx,dy] of [[-27,0],[27,0],[0,-26],[0,26]]) {
      oval(x+dx*size,y+dy*size,8*size,7*size,"#613f36");
      oval(x+dx*size,y+dy*size-2,6*size,4*size,"#906047");
    }
    oval(x+2,y+6,27*size,21*size,"#634039");
    oval(x,y,25*size,19*size,"#e2a762");
    oval(x,y-2,22*size,15*size,"#f1be77");
    rect(x-14*size,y-9*size,28*size,15*size,"#aa5c4b");
    for (let i = -10; i <= 10; i += 5) {
      line([[x+i*size,y-9*size],[x+i*size,y+6*size]],"#e49668",1.1);
    }
    oval(x-6*size,y-1,4.4*size,3.1*size,"#fff0ba");
    oval(x+6*size,y-1,4.4*size,3.1*size,"#fff0ba");
    if (string(table.id)) label("Bàn "+table.id,x,y+38*size);
    if (deliver && inRange(player.pos,table.pos,meta.interact_radius)) {
      pill("E · Giao món",x,y+56*size,"#ffe195");
    }
  }
}
function customerSprites(customers,tables,map) {
  const stand = clamp(map.s*.58,20,35);
  for (const customer of customers) {
    const table = tables.find(candidate =>
      (string(customer.table_id) && candidate.id === customer.table_id) ||
      (string(customer.id) && candidate.customer_id === customer.id));
    const seat = table ? map.xy(table.pos) : null;
    const pos = map.xy(customer.pos) ?? (seat ? [seat[0],seat[1]-stand] : null);
    if (!pos) continue;
    const [x,y] = pos;
    oval(x,y+5,12,9,"#62433f");
    oval(x,y+5,11,8,customer.state === "eating" ? "#839b66" : "#527a76");
    oval(x,y-4,9,7,"#eab37f");
    oval(x,y-7,9,5,"#634641");
    const dish = dishId(customer);
    if (dish && customer.state !== "eating") {
      oval(x,y-28,13.5,12.5,"#6c5940");
      oval(x,y-29,12.1,11.3,"#fff1ca");
      dishArt(ctx,dish,x,y-29,.72);
    } else label(customer.state === "eating" ? "Đang ăn" : "Khách",x,y-19,{ size:11 });
  }
}
let restaurantFacing = 1;
function restaurantPlayer(player,data,meta,map,t) {
  const pos = map.xy(player.pos);
  if (!pos) return;
  const [x,y] = pos;
  const radius = meta.interact_radius;
  if (number(radius) && radius > 0) {
    const rim = Array.from({ length: 33 }, (_,i) => {
      const angle = i/32*TAU;
      return map.xy([player.pos[0]+radius*Math.cos(angle),player.pos[1]+radius*Math.sin(angle)]);
    });
    if (rim.every(Boolean)) {
      ctx.setLineDash([4,5]);
      line(rim,"#fff1b9ab",1.5);
      ctx.setLineDash([]);
    }
  }
  const size = clamp(map.s/27,.87,1.51);
  const movement = point(player.vel) ? player.vel : input().move;
  if (movement[0]) restaurantFacing = Math.sign(movement[0]);
  const stride = movement.some(Boolean) && data.finished !== true ? Math.sin(t*11) : 0;
  oval(x,y+11*size,17*size,6*size,"#60415552");
  sen(x,y,size,0,false,stride,restaurantFacing);
  const dish = dishId(data.hand);
  if (dish) dishArt(ctx,dish,x+17*size,y+3*size,size*.89);
  label("Út Sen",x,y+27*size);
}
function serviceEffect(data,tables,map,hz) {
  const event = recentService(data,hz);
  if (!object(event?.data) || !string(event.data.table_id)) return;
  const table = tables.find(item => item.id === event.data.table_id);
  const at = map.xy(table?.pos);
  if (!at) return;
  const [x,y] = at;
  const age = clamp((data.tick-event.tick)/(hz*2),0,1);
  const lift = reduceMotion.matches ? 0 : age*15;
  ctx.globalAlpha = 1-Math.max(0,age-.65);
  if (event.name === "paid" && !number(event.data.amount)) return;
  pill(event.name === "served" ? "✓ Đã giao" : "+"+event.data.amount+" nghìn",x,y-42-lift,"#e6f4ac");
  if (!reduceMotion.matches) {
    for (const [dx,dy] of [[-23,-26],[22,-29],[30,-13],[-28,-13]]) {
      oval(x+dx*(1+age*.2),y+dy-lift,2.4*(1-age)+.7,2.1,"#fff3ba");
    }
  }
}
function frame(now) {
  requestAnimationFrame(frame);
  if (!ctx || !canvas.clientWidth || !canvas.clientHeight) return;
  const width = canvas.clientWidth, height = canvas.clientHeight;
  const dpr = Math.min(devicePixelRatio || 1,2);
  const targetW = Math.round(width*dpr), targetH = Math.round(height*dpr);
  if (canvas.width !== targetW || canvas.height !== targetH) {
    canvas.width = targetW;
    canvas.height = targetH;
  }
  const w = width, h = height;
  ctx.setTransform(targetW/w,0,0,targetH/h,0,0);
  rect(0,0,w,h,"#253e37");
  if (!mode) return;
  const {data,meta,player,hz} = fields();
  const morning = mode === "gather";
  const map = project(meta,w,h,morning);
  const t = reduceMotion.matches ? 0 : now/1000;
  if (morning) {
    layer("nền sông", () => river(w,h,map,meta,t),true);
    if (!map) return;
    layer("bến", () => dock(map,meta),true);
    layer("nút hái", () => plants(records(data.nodes),map,hz),true);
    layer("đàn cá", () => fishSchool(records(data.fish),map,t),true);
    layer("Út Sen dưới sông", () => gatherPlayer(player,data,meta,map,t),true);
  } else {
    layer("nền quán", () => quay(w,h,map,t),true);
    if (!map) return;
    const tables = records(data.tables);
    layer("bếp trên sàn", () => stoveSprites(records(data.stoves),map,t,player,meta,hz),true);
    layer("bàn trên sàn", () => tablesSprites(tables,map,data,player,meta),true);
    layer("khách", () => customerSprites(records(data.customers),tables,map),true);
    layer("Út Sen trong quán", () => restaurantPlayer(player,data,meta,map,t),true);
    layer("phản hồi giao món", () => serviceEffect(data,tables,map,hz),true);
  }
}
void poll();
requestAnimationFrame(frame);
</script>
