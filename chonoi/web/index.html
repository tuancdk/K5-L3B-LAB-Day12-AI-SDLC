<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
<title>Quán Ăn Chợ Nổi</title>
<style>
  :root {
    color-scheme: light;
    --paper: #f7efdd;
    --canvas: #3d5850;
    --ink: #263328;
    --muted: #596251;
    --line: #dbccb0;
    --accent: #276753;
    --panel: #fff8e9;
    --halo: #e5ecd9;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at 18% 0%, #fff8e9 0%, transparent 52%), var(--paper);
    color: var(--ink);
    font: 15px/1.45 system-ui, sans-serif;
  }
  body:is([data-mode="quan"],[data-mode="shop"]) {
    color-scheme: dark;
    --paper: #102433;
    --ink: #fff6df;
    --muted: #d1dcdf;
    --line: #456778;
    --accent: #ffd478;
    --panel: #203d4d;
    --halo: #2c5462;
    background: radial-gradient(ellipse at 18% 0%, #255366 0%, transparent 64%), var(--paper);
  }
  body[data-mode="quan"] h1 { text-shadow: 0 3px #152d39; }
  body[data-mode="quan"] .meter, body[data-mode="quan"] .guide, body[data-mode="quan"] .journal {
    border: 2px solid var(--line); box-shadow: 0 3px #0b202d;
  }
  body[data-mode="quan"] .meter { border-top-color: #688798; }
  body[data-mode="quan"] main { max-width: 1320px; padding-top: 14px; }
  body[data-mode="quan"] header { margin-bottom: 12px; }
  body[data-mode="quan"] h1 { font-size: clamp(1.55rem, 3.3vw, 2.4rem); }
  body[data-mode="quan"] .dashboard { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; }
  body[data-mode="quan"] .layout { grid-template-columns: minmax(0, 1fr); gap: 10px; margin-top: 10px; }
  body[data-mode="quan"] .meters { grid-template-columns: repeat(3, minmax(78px, auto)); gap: 5px; }
  body[data-mode="quan"] .meter { padding: 8px 12px; }
  body[data-mode="quan"] .meter--clock { background: #fff0bf; border-color: #d8a864; }
  body[data-mode="quan"] .meter--clock :is(.label,.value,.meter-icon) { color: #432b2a; }
  body[data-mode="quan"] .meter--urgent { background: #ffc1a3; border-color: #ec9077; }
  body[data-mode="quan"] aside { grid-template-columns: auto minmax(0,1fr); }
  body[data-mode="quan"] .guide-top { margin: 0; }
  body[data-mode="quan"] #portrait { width: 38px; height: 38px; }
  body[data-mode="quan"] .journal { display: grid; grid-template-columns: minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr); gap: 10px; }
  body[data-mode="quan"] .journal section + section { margin: 0; padding: 0 0 0 10px; border: 0; border-inline-start: 1px solid var(--line); }
  body[data-mode="quan"] .guide { display: flex; align-items: center; }
  body[data-mode="quan"] .guide :is(.eyebrow,.guide-sub) { display: none; }
  body[data-mode="quan"] #restart { background: #ffd478; color: #28372e; border: 2px solid #876046; box-shadow: 0 3px #102433; }
  body[data-mode="quan"] #restart kbd { background: #fff0be; color: #28372e; border-color: #b88750; }
  body[data-mode="quan"] #restart:hover { background: #ffe4a0; }
  main { max-width: 1510px; padding: 22px clamp(14px, 3.2vw, 48px) 24px; margin: auto; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
  .eyebrow { margin: 0 0 4px; color: var(--accent); font-size: .72rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
  h1, h2 { font-family: Georgia, "Times New Roman", serif; line-height: 1.13; }
  h1 { margin: 0; font-size: clamp(1.74rem, 4.1vw, 3rem); letter-spacing: -.035em; }
  button, kbd { background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 6px; }
  button { padding: 7px 11px; cursor: pointer; font: 700 .83rem system-ui, sans-serif; white-space: nowrap; }
  button:hover, button.active { background: var(--halo); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  kbd { padding: 2px 5px; font: 700 .74rem system-ui, sans-serif; }
  .meters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .meter { display: grid; align-content: center; gap: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 9px 13px; min-width: 0; }
  .meter-title { display: flex; align-items: center; gap: 7px; }
  .meter-icon { color: var(--accent); font-size: .94rem; line-height: 1; }
  .label { color: var(--muted); font-size: .72rem; font-weight: 780; letter-spacing: .055em; text-transform: uppercase; }
  .value { display: block; color: var(--ink); font-size: clamp(1rem, 2vw, 1.35rem); font-weight: 800; font-variant-numeric: tabular-nums; }
  .track { height: 4px; border-radius: 4px; overflow: hidden; background: var(--halo); }
  .fill { display: block; height: 100%; background: var(--accent); }
  .warn { background: #da7059; }
  .layout { display: grid; align-items: start; grid-template-columns: minmax(0, 1fr) minmax(220px, 23%); gap: 14px; margin-top: 12px; }
  .stage { position: relative; overflow: hidden; isolation: isolate; border-radius: 13px; background: var(--canvas); border: 1px solid #233e37; box-shadow: 0 8px 24px #1e291723; }
  body[data-mode="quan"] .stage { border: 3px solid #4a7380; box-shadow: 0 5px #0b1d28; }
  body[data-mode="quan"] .scene-key { background: #193845; }
  #scene { width: 100%; display: block; aspect-ratio: 2.06 / 1; }
  @media (min-width: 761px) {
    body[data-mode="quan"] #scene { aspect-ratio: 2.55 / 1; }
  }
  .scene-key { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 3px 12px; padding: 7px 12px; background: #202c27; color: #f2e5c7; font-size: .74rem; }
  .scene-key span:before { content: "◆"; color: #e4b869; margin-right: 6px; font-size: .58rem; }
  .message { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: max-content; max-width: 94%; padding: 8px 12px; border-radius: 7px; background: #222721; color: #fff0d1; border: 1px solid #edd095; text-align: center; }
  aside { display: grid; gap: 9px; }
  .guide, .journal { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow-wrap: anywhere; }
  .guide { padding: 11px 12px 12px; }
  .guide-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  #portrait { width: 56px; height: 56px; flex: none; border-radius: 50%; background: var(--halo); border: 1px solid var(--line); }
  .guide h2 { margin: 2px 0 0; font-size: 1.28rem; }
  .guide p { margin: 0; }
  .guide-sub { font-size: .83rem; color: var(--muted); }
  .journal { padding: 11px 13px; }
  .journal h2 { font: 750 .95rem/1.25 system-ui, sans-serif; margin: 0 0 5px; color: var(--accent); }
  .journal section + section { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
  .journal p { margin: 0; }
  .journal ul { list-style: none; padding: 0; margin: 0; }
  .journal li + li { margin-top: 6px; }
  .detail { margin-top: 2px; color: var(--muted); font-size: .82rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { padding: 2px 7px; background: var(--halo); border-radius: 12px; font-size: .78rem; }
  .chips li + li { margin-top: 0; }
  .order-board { padding: 0; }
  .order-board h2 { margin: 0 0 6px 1px; color: var(--accent); font: 800 .72rem/1.2 system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase; }
  .orders { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 209px), 1fr)); gap: 6px; margin: 0; list-style: none; padding: 0; }
  .orders-empty { padding: 3px 2px; margin: 0; color: var(--muted); font-size: .86rem; }
  .ticket { display: grid; grid-template-columns: 38px minmax(0,1fr); align-items: center; gap: 7px; padding: 6px 8px; background: #fff4d2; color: #263b3d; border: 2px solid #d5ac62; border-radius: 8px; box-shadow: 0 2px #071f28; }
  .ticket.urgent { background: #ffdfc7; border-color: #d17057; }
  .ticket.eating { background: #e5f4cb; border-color: #89ab63; }
  .ticket canvas { width: 38px; height: 38px; background: #f3daa0; border-radius: 50%; }
  .ticket-info { min-width: 0; display: grid; gap: 2px; }
  .ticket strong { overflow-wrap: anywhere; font-size: .87rem; }
  .ticket-meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0 7px; color: #495753; font-size: .72rem; font-weight: 750; font-variant-numeric: tabular-nums; }
  .ticket .track { background: #ded4b4; margin-top: 1px; }
  .ticket .fill { background: #4f8758; }
  .ticket.urgent .fill { background: #c35843; }
  .scene-action { display: flex; align-items: center; gap: 9px; padding: 6px 10px; min-height: 42px; background: #162f3e; border-top: 2px solid #446675; }
  .scene-action strong { flex: none; border-radius: 6px; background: #fae4ab; color: #3a2c29; padding: 3px 8px; font-size: .73rem; }
  .scene-action p { margin: 0; font-size: .83rem; color: #fff4da; }
  body[data-mode="quan"] .controls { margin-top: 8px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 17px; margin-top: 12px; color: var(--muted); font-size: .82rem; }
  .touch-controls { display: none; gap: 10px; margin-top: 10px; justify-content: space-between; align-items: center; }
  .direction-pad { display: grid; grid-template-columns: repeat(3, 43px); gap: 4px; }
  .direction-pad button:first-child { grid-column: 2; }
  .direction-pad button:nth-child(2) { grid-column: 1; }
  .touch-actions { display: flex; flex-wrap: wrap; justify-content: end; gap: 5px; }
  .touch-controls button { min-height: 42px; touch-action: none; user-select: none; }
  @media (pointer: coarse), (max-width: 600px) {
    .touch-controls { display: flex; }
    .controls { display: none; }
  }
  @media (max-width: 760px) {
    main { padding-top: 12px; }
    header { margin-bottom: 10px; }
    .layout { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .meter { padding: 7px 8px; }
    #scene { aspect-ratio: 1.33 / 1; }
    .guide-top { margin-bottom: 4px; }
    #portrait { width: 44px; height: 44px; }
  }
  @media (max-width: 600px) {
    body[data-mode="quan"] .dashboard { grid-template-columns: minmax(0,1fr); }
    body[data-mode="quan"] .meters { grid-template-columns: repeat(3,minmax(0,1fr)); }
    body[data-mode="quan"] .meter { padding: 6px 8px; }
    body[data-mode="quan"] aside { grid-template-columns: minmax(0,1fr); }
    body[data-mode="quan"] .guide { display: none; }
  }
  @media (max-width: 430px) {
    body[data-mode="quan"] .journal { grid-template-columns: 1fr 1fr; }
    body[data-mode="quan"] .journal section:first-child { grid-column: 1 / -1; }
    body[data-mode="quan"] .journal section:nth-child(2) { padding-left: 0; border: 0; }
  }
  .header-actions { display: flex; flex-wrap: wrap; justify-content: end; gap: 6px; }
  dialog {
    width: min(calc(100% - 28px), 620px);
    padding: clamp(16px, 4vw, 32px);
    max-height: calc(100dvh - 28px);
    border-radius: 16px;
    border: 3px solid #d8a55c;
    background: #fff1d3;
    color: #263931;
    box-shadow: 0 14px 42px #101f27aa;
    color-scheme: light;
    font: 18px/1.4 system-ui, sans-serif;
  }
  dialog::backdrop { background: #112b34aa; backdrop-filter: blur(4px); }
  dialog h2 { margin: 0 0 10px; font: 850 1.7em/1.14 system-ui, sans-serif; }
  dialog p { margin: 0 0 12px; }
  dialog .eyebrow { color: #805530; }
  .modal-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .modal-actions button, .shop-item button {
    --panel: #f7dfaa; --line: #a77a4e; --ink: #392f23; --halo: #f4cf82;
    white-space: normal; font-size: 1rem; min-height: 42px;
  }
  .modal-actions .primary { --panel: #317360; --line: #245c4b; --ink: #fff8e6; --halo: #296454; }
  .modal-actions button:focus-visible, dialog input:focus-visible, .shop-item button:focus-visible { outline-color: #256c62; }
  .modal-list { margin: 0; padding-inline-start: 1.3em; }
  .modal-stats { margin: 0; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 7px 12px; }
  .modal-stats dd { margin: 0; font-weight: 750; text-align: right; }
  .shop-grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit,minmax(min(100%,210px),1fr)); }
  .shop-item { display: grid; align-content: start; gap: 5px; padding: 12px; border: 1px solid #c8a772; border-radius: 10px; }
  .shop-item button { margin-top: 6px; }
  .shop-feedback { margin: 10px 0 0; color: #8d2f34; font-weight: 760; }
  .shop-feedback.success { color: #28634e; }
  dialog button:disabled { opacity: .58; cursor: wait; }
  .setting-row { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; margin-bottom: 12px; }
  .setting-row input { grid-column: 1 / -1; width: 100%; accent-color: #317360; }
  .stage.danger { outline: 4px solid #a54ebf; outline-offset: -4px; }
  .notice { position: absolute; top: 10px; right: 10px; max-width: 90%; border-radius: 8px; padding: 5px 10px; background: #562861; color: #fff2d9; font-weight: 800; }
  .notice.air { background: #8b3938; }
  .meter--low-oxygen, .meter--urgent { background: #ffdeb2; border-color: #b75345; }
  .meter--low-oxygen :is(.label,.value,.meter-icon) { color: #792c30; }
  body[data-mode="gather"] .meters { grid-template-columns: repeat(4,minmax(0,1fr)); }
  .need-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 8px; }
  .need-row strong { color: var(--accent); white-space: nowrap; }
  @media (prefers-reduced-motion:no-preference) {
    .meter--low-oxygen .fill { animation: oxygen-warning 1.2s ease-in-out infinite alternate; }
  }
  @keyframes oxygen-warning { to { opacity: .45; } }
  body[data-mode="shop"] .layout { display: block; }
  body[data-mode="shop"] :is(aside,.controls,.touch-controls,.scene-key,.scene-action) { display: none; }
  @media (min-width: 1000px) {
    body[data-run="day"] :is(h1,h2) { font-family: system-ui, sans-serif; }
    body[data-run="day"] :is(.label,.value,.journal h2,.detail,.chip,.controls,.ticket strong,.ticket-meta,
      .scene-action p,.scene-action strong,.notice,.guide-sub,.scene-key,.order-board h2,.need-row) { font-size: 18px; }
    body[data-run="day"] .orders { grid-template-columns: repeat(auto-fill,minmax(min(100%,260px),1fr)); }
    body[data-run="day"] #scene { aspect-ratio: 2.65 / 1; }
    body[data-run="day"][data-mode="quan"] .layout { grid-template-columns: minmax(0,1fr) minmax(238px,23%); }
    body[data-run="day"][data-mode="quan"] aside { display: block; }
    body[data-run="day"][data-mode="quan"] .guide { display: none; }
    body[data-run="day"][data-mode="quan"] .journal { display: block; }
    body[data-run="day"][data-mode="quan"] .journal section + section {
      border: 0; border-top: 1px solid var(--line); margin-top: 8px; padding: 8px 0 0;
    }
  }

  /* ===== Lớp "bếp hỗn loạn": viền mực dày, bóng cứng, HUD nổi trên sân chơi ===== */
  :root {
    --ink-line: #2b1b14;      /* viền mực nâu đen như tranh hoạt hình */
    --wood: #e4a65e;
    --cream: #fff3d6;
    --leaf: #3f8f5a;
    --chili: #d9483b;
    --lantern: #ffc847;
    --chunk: 3px solid var(--ink-line);
    --drop: 0 4px 0 var(--ink-line);
    --display: "Baloo 2", system-ui, sans-serif;
  }
  body { font-family: var(--display); }
  h1, h2, dialog h2, .journal h2, .order-board h2, button, kbd, .label, .value { font-family: var(--display); }
  main { display: flex; flex-direction: column; min-height: 100dvh; }
  header { margin-bottom: 10px; }
  h1 { letter-spacing: -.01em; font-weight: 800; }
  .header-actions button {
    border: var(--chunk); box-shadow: var(--drop); border-radius: 12px; padding: 6px 13px;
    background: var(--cream); color: #2b1b14; font-weight: 800; transition: transform .08s;
  }
  .header-actions button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink-line); }
  body[data-mode="quan"] #restart, body[data-mode="quan"] #restart:hover { border: var(--chunk); box-shadow: var(--drop); background: var(--lantern); }
  .play { display: flex; flex-direction: column; gap: 10px; }
  .hud-right { display: contents; }
  .hud-right .meters { order: -2; }
  .order-board { order: -1; }
  .stage { border: var(--chunk) !important; box-shadow: 0 6px 0 var(--ink-line) !important; border-radius: 18px; }
  .scene-action strong { background: var(--lantern); color: #2b1b14; border: 2px solid var(--ink-line); border-radius: 9px; font-weight: 800; }

  /* Chỉ số: nhãn dán dày, đồng hồ to như Overcooked */
  .meter { border: var(--chunk) !important; box-shadow: var(--drop) !important; border-radius: 14px; background: var(--cream); }
  .meter :is(.label,.value,.meter-icon) { color: #2b1b14; }
  .meter .track { height: 8px; border: 2px solid var(--ink-line); background: #f1dcae; border-radius: 6px; }
  .meter .fill { background: var(--leaf); }
  .meter .fill.warn { background: var(--chili); }
  .meter--time { background: var(--lantern) !important; }
  .meter--urgent, .meter--low-oxygen { background: #ffb59c !important; }
  @media (prefers-reduced-motion: no-preference) {
    .meter--urgent { animation: tick-pulse .5s ease-in-out infinite alternate; }
  }
  @keyframes tick-pulse { to { transform: scale(1.06); } }

  /* Phiếu món: giấy kẹp trên sợi dây đèn lồng */
  .order-board h2 { display: none; }
  .orders { display: flex; flex-wrap: wrap; gap: 10px 12px; padding-top: 10px; position: relative; }
  .ticket {
    position: relative; grid-template-columns: 46px minmax(0,1fr); gap: 8px; min-width: 210px; max-width: 260px; flex: 0 1 230px;
    padding: 10px 10px 8px; background: #fffaf0; color: #2b1b14;
    border: var(--chunk); border-radius: 6px 6px 14px 14px; box-shadow: var(--drop);
    transform: rotate(-1.2deg); transform-origin: 50% -10px;
  }
  .ticket:nth-child(even) { transform: rotate(1.3deg); }
  .ticket::before {  /* cái kẹp gỗ */
    content: ""; position: absolute; top: -12px; left: 50%; width: 12px; height: 20px; margin-left: -6px;
    background: var(--wood); border: 2px solid var(--ink-line); border-radius: 4px;
  }
  .ticket canvas { width: 46px; height: 46px; background: #ffe7b0; border: 2px solid var(--ink-line); }
  .ticket strong { font-weight: 800; line-height: 1.15; }
  .ticket-meta { color: #6a5040; }
  .ticket .track { height: 10px; border: 2px solid var(--ink-line); background: #f1e4c4; border-radius: 6px; margin-top: 3px; }
  .ticket .fill { background: var(--leaf); transition: width .3s linear, background-color .3s; }
  .ticket.warn .fill { background: #eaa22a; }
  .ticket.urgent { background: #ffe2d8; border-color: #8f1f17; }
  .ticket.urgent .fill { background: var(--chili); }
  .ticket.eating { background: #eaf6d5; }
  @media (prefers-reduced-motion: no-preference) {
    .ticket { animation: ticket-in .35s cubic-bezier(.3,1.6,.5,1) both; }
    .ticket.urgent { animation: ticket-shake .45s ease-in-out infinite; }
  }
  @keyframes ticket-in { from { transform: translateY(-40px) rotate(-8deg); opacity: 0; } }
  @keyframes ticket-shake {
    0%,100% { transform: rotate(-1.5deg); } 25% { transform: rotate(2.5deg) translateX(1px); }
    75% { transform: rotate(-3deg) translateX(-1px); }
  }

  /* Bảng phụ bên phải: tấm biển gỗ */
  .journal { border: var(--chunk) !important; box-shadow: var(--drop) !important; border-radius: 14px; background: var(--cream); color: #2b1b14; }
  .journal h2 { color: #8a4a1c; font-weight: 800; }
  .journal .detail, .journal p { color: #4c3a2f; }
  .chip { background: #ffe2a6; border: 2px solid var(--ink-line); font-weight: 700; color: #2b1b14; }
  .need-row strong { color: var(--leaf); }
  .journal .track { height: 8px; border: 2px solid var(--ink-line); background: #f1dcae; }
  .journal .fill { background: #eaa22a; }

  /* Rung màn hình khi bị cắn */
  @media (prefers-reduced-motion: no-preference) {
    .stage.hit { animation: stage-shake .35s linear; }
  }
  @keyframes stage-shake {
    20% { transform: translate(-6px,2px); } 40% { transform: translate(5px,-3px); }
    60% { transform: translate(-4px,1px); } 80% { transform: translate(3px,-1px); }
  }

  /* Hộp thoại: biển hiệu quán */
  dialog { border: 4px solid var(--ink-line); box-shadow: 0 8px 0 var(--ink-line), 0 24px 60px #0b1a22aa; border-radius: 22px; font-family: var(--display); }
  dialog h2 { font-weight: 800; font-size: 2em; }
  @media (prefers-reduced-motion: no-preference) {
    dialog[open] { animation: sign-drop .38s cubic-bezier(.3,1.5,.5,1); }
  }
  @keyframes sign-drop { from { transform: translateY(-30px) scale(.92); opacity: 0; } }
  .modal-actions button, .shop-item button { border: var(--chunk); box-shadow: var(--drop); border-radius: 12px; font-weight: 800; }
  .modal-actions button:active:not(:disabled), .shop-item button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink-line); }
  .shop-item { border: var(--chunk); border-radius: 14px; background: #fff8e6; box-shadow: var(--drop); }
  .shop-item .shortfall { color: #8d2f34; font-weight: 700; }
  /* Tiêu chí #16: chữ không chân ≥ 18 px ở 1280×720 — cả nhãn phím, nút và dòng tiêu đề pha */
  @media (min-width: 1000px) {
    body[data-run="day"] :is(.eyebrow,kbd,.header-actions button,.modal-actions button,.shop-item button,.ticket-meta span,.journal :is(p,li,strong)) { font-size: 18px; }
  }
  .shop-item button.poor { --panel: #e9dcc0; --halo: #e9dcc0; --ink: #7a6a58; box-shadow: 0 2px 0 var(--ink-line); }
  dialog button:disabled { cursor: not-allowed; }
  .stars { display: flex; gap: 6px; margin: 4px 0 14px; font-size: 2.3rem; line-height: 1; }
  .stars span { color: #d9c7a3; -webkit-text-stroke: 2px var(--ink-line); }
  .stars span.on { color: var(--lantern); }
  @media (prefers-reduced-motion: no-preference) {
    .stars span.on { animation: star-pop .45s cubic-bezier(.3,1.8,.5,1) both; }
    .stars span:nth-child(2) { animation-delay: .15s; } .stars span:nth-child(3) { animation-delay: .3s; }
    .stars span:nth-child(4) { animation-delay: .45s; } .stars span:nth-child(5) { animation-delay: .6s; }
  }
  @keyframes star-pop { from { transform: scale(0) rotate(-40deg); } }
  .title-card { text-align: center; }
  .title-card h2 { font-size: 2.6em; color: #8a3b1c; }
  .title-card .modal-actions { justify-content: center; }

  /* Màn rộng: sân chơi chiếm toàn bộ, HUD nổi ở các góc */
  @media (min-width: 900px) {
    main { max-width: none !important; padding: 12px 18px 10px !important; }
    header { margin-bottom: 10px !important; }
    header > div:first-child { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    header .eyebrow { order: 2; margin: 0; }
    h1 { font-size: 1.9rem !important; text-shadow: 0 3px 0 #0000001f; }
    .play { display: grid; grid-template: minmax(0,1fr) / minmax(0,1fr); flex: 1; }
    .play > * { grid-area: 1 / 1; }
    .hud-right { display: flex; flex-direction: column; gap: 10px; justify-self: end; align-self: start;
      width: clamp(250px, 22vw, 300px); margin: 14px 14px 0 0; z-index: 2; max-height: calc(100% - 80px); overflow: auto; }
    .hud-right .meters { display: grid !important; grid-template-columns: repeat(2, minmax(0,1fr)) !important; gap: 8px !important; }
    .hud-right { scrollbar-width: thin; }
    .hud-right .meter { padding: 5px 11px !important; gap: 1px; }
    .hud-right .meter--time { grid-column: 1 / -1; padding: 6px 14px !important; }
    .hud-right .meter--time .value { font-size: 2.1rem !important; line-height: 1; }
    body[data-mode="gather"] .hud-right .meter:last-child:nth-child(even) { grid-column: 1 / -1; }
    h1 { font-family: var(--display) !important; }
    .hud-right aside { display: block !important; }
    .hud-right .guide { display: none !important; }
    .hud-right .journal { display: block !important; padding: 10px 12px; }
    .hud-right .journal section + section { border: 0 !important; border-top: 2px dashed #c9a46b !important; margin-top: 8px !important; padding: 8px 0 0 !important; }
    .order-board { justify-self: start; align-self: start; z-index: 2; margin: 10px 0 0 16px; max-width: calc(100% - clamp(250px,22vw,300px) - 50px); }
    .stage { display: flex; flex-direction: column; }
    #scene, body[data-run="day"] #scene, body[data-mode="quan"] #scene {
      aspect-ratio: auto !important; flex: 1 1 0; height: auto; min-height: 0;
    }
    main { height: 100dvh; min-height: 520px; }
    .play { flex: 1 1 0; min-height: 0; }
    .stage { min-height: 0; }
    .below .controls { margin-top: 8px; }
    .message { top: auto; bottom: 64px; font-size: 1.1rem; border: var(--chunk); box-shadow: var(--drop); background: var(--cream); color: #2b1b14; border-radius: 12px; }
    .notice { top: auto; bottom: 64px; right: 50%; transform: translateX(50%); font-size: 1.3rem; padding: 6px 16px; border: var(--chunk); box-shadow: var(--drop); border-radius: 12px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div><p class="eyebrow" id="phase">Chợ nổi miền Tây</p><h1>Quán Ăn Chợ Nổi</h1></div>
    <div class="header-actions">
      <button type="button" id="pause-game" aria-keyshortcuts="P Escape">Tạm dừng</button>
      <button type="button" id="restart" aria-keyshortcuts="R">↻ Chơi lại <kbd>R</kbd></button>
    </div>
  </header>
  <div class="play" id="play">
    <section class="order-board" id="order-board" aria-labelledby="order-heading" hidden>
      <h2 id="order-heading">Đơn trên bàn</h2>
      <div id="orders"></div>
    </section>
    <div class="stage" id="game-stage">
      <canvas id="scene" aria-label="Cảnh chơi của Út Sen"></canvas>
      <div class="message" id="message" role="status">Đang kết nối…</div>
      <div class="notice" id="gather-alert" role="status" hidden></div>
      <div class="scene-key" id="legend"></div>
      <div class="scene-action" id="scene-action" hidden>
        <strong id="action-tag" aria-live="polite">Gợi ý</strong>
        <p id="action-tip"></p>
      </div>
    </div>
    <div class="hud-right" id="hud-right">
      <div class="meters" id="meters" aria-label="Chỉ số của lượt chơi"></div>
      <aside aria-label="Hướng dẫn và vật phẩm">
        <div class="guide">
          <div class="guide-top">
            <canvas id="portrait" width="128" height="128" aria-hidden="true"></canvas>
            <div><p class="eyebrow">Bạn đang chơi</p><h2>Út Sen</h2></div>
          </div>
          <p class="guide-sub" id="tip">Đang tải hướng dẫn…</p>
        </div>
        <div class="journal" id="journal" aria-label="Giỏ và tình trạng quán"></div>
      </aside>
    </div>
  </div>
  <div class="below">
      <div class="controls" aria-label="Phím điều khiển">
        <span><kbd>WASD</kbd> / <kbd>↑ ↓ ← →</kbd> Di chuyển</span>
        <span><kbd>E</kbd> <span id="interact-label">Tương tác</span></span>
        <span id="catch-key"><kbd>Space</kbd> Bắt cá</span>
      </div>
      <div class="touch-controls" aria-label="Điều khiển trên màn hình">
        <div class="direction-pad">
          <button type="button" data-input="arrowup" aria-label="Lên">↑</button>
          <button type="button" data-input="arrowleft" aria-label="Trái">←</button>
          <button type="button" data-input="arrowdown" aria-label="Xuống">↓</button>
          <button type="button" data-input="arrowright" aria-label="Phải">→</button>
        </div>
        <div class="touch-actions">
          <button type="button" id="touch-interact" data-input="e">Tương tác</button>
          <button type="button" id="touch-catch" data-input=" ">Bắt cá</button>
        </div>
      </div>
  </div>
</main>
<dialog id="game-dialog" aria-labelledby="dialog-title"></dialog>
<script>
"use strict";

const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");
const elements = Object.fromEntries(
  ["phase", "restart", "meters", "message", "legend", "interact-label", "catch-key", "journal",
    "tip", "touch-interact", "touch-catch", "portrait", "order-board", "orders", "scene-action",
    "action-tag", "action-tip", "game-stage", "gather-alert", "game-dialog", "pause-game"]
    .map(id => [id, document.getElementById(id)])
);
const object = value => value !== null && typeof value === "object" && !Array.isArray(value);
const number = Number.isFinite;
const string = value => typeof value === "string" && value.trim() !== "";
const point = value => Array.isArray(value) && value.length === 2 && value.every(number);
const range = value => point(value) && value[0] < value[1] && number(value[1] - value[0]);
const records = value => Array.isArray(value) ? value.filter(object) : [];
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
const validMode = mode => mode === "gather" || mode === "quan";
// v1.0 có thể không gửi tick_hz trong meta.
const tickHz = meta => number(meta.tick_hz) && meta.tick_hz > 0 ? meta.tick_hz : 60;
const seconds = (ticks, hz) => Math.ceil(Math.max(0, ticks) / hz);
const time = (ticks, hz) => {
  if (!number(ticks)) return "—";
  const s = seconds(ticks, hz);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
};
const ingredients = new Map([
  ["ca_loc", "Cá lóc"], ["ca_linh", "Cá linh"], ["ca_keo", "Cá kèo"],
  ["bong_dien_dien", "Bông điên điển"], ["bong_sung", "Bông súng"], ["keo_neo", "Kèo nèo"]
]);
const dishes = new Map([
  ["ca_loc_nuong_trui", "Cá lóc nướng trui"], ["goi_bong_sung", "Gỏi bông súng"],
  ["lau_ca_linh_dien_dien", "Lẩu cá linh điên điển"],
  ["canh_chua_ca_loc", "Canh chua cá lóc bông điên điển"],
  ["ca_keo_nuong", "Cá kèo nướng muối ớt"], ["lau_mam", "Lẩu mắm miền Tây"]
]);
function dishId(value) {
  if (string(value)) return value;
  if (!object(value)) return null;
  if (string(value.dish_id)) return value.dish_id;
  if (string(value.dish)) return value.dish;
  return null;
}
const dishName = value => dishes.get(value) ?? value;
const stoveLabel = new Map([["idle", "Bếp trống"], ["cooking", "Đang nấu"], ["ready", "Đã chín"], ["burnt", "Đã khét"]]);

// Gửi từng trạng thái theo thứ tự, kể cả bấm/nhả xảy ra giữa hai tick.
const keys = new Set();
const touches = new Map();
const touchButtons = document.querySelectorAll("[data-input]");
const moves = new Map([
  ["w", "up"], ["arrowup", "up"], ["s", "down"], ["arrowdown", "down"],
  ["a", "left"], ["arrowleft", "left"], ["d", "right"], ["arrowright", "right"]
]);
let snapshot = null;
let mode = null;
let runMode = null;
let pollGeneration = 0;
let offline = false;
let pending = [];
let sending = false;
let sent = "";
function input() {
  const held = elements["game-dialog"].open ? new Set() : new Set([...keys, ...touches.values()]);
  const directions = new Set([...held].map(key => moves.get(key)));
  const x = Number(directions.has("right")) - Number(directions.has("left"));
  const y = Number(directions.has("down")) - Number(directions.has("up"));
  return { move: [x, mode === "quan" ? -y : y], interact: held.has("e"), catch: held.has(" ") };
}
function sendKeys() {
  if (!mode) return;
  const body = JSON.stringify(input());
  if (body === sent) return;
  sent = body;
  pending.push({ path: "/input", body });
  void send();
}
function command(data) {
  pending.push({ path: "/input", body: JSON.stringify(data) });
  void send();
}
function pulse(button) {
  command({ [button]: true });
  command({ [button]: false });
}
async function send() {
  if (sending) return;
  sending = true;
  try {
    while (pending.length) {
      const { path, body } = pending.shift();
      const response = await fetch(path, {
        method: "POST", body, headers: { "Content-Type": "application/json" },
        signal: AbortSignal.timeout(2000)
      });
      if (!response.ok) throw new Error("HTTP " + response.status);
      if (path === "/restart") {
        pollGeneration++;
        campaign.starting = false;
      }
    }
  } catch {
    pending = [];
    sent = ""; // poll gửi lại trạng thái đang giữ khi kết nối hồi phục.
    campaign.starting = false;
    campaign.pauseRequest = null;
    offline = true;
  } finally {
    sending = false;
  }
}
function restart() {
  clearInput();
  resetCampaign();
  campaign.starting = true;
  pending = [{ path: "/restart" }];
  sent = "";
  void send();
}
function releaseKeys() {
  clearInput();
  sendKeys();
}
function clearInput() {
  keys.clear();
  touches.clear();
  for (const button of touchButtons) button.classList.remove("active");
}
function gameKey(event) {
  const key = event.key.toLowerCase();
  return moves.has(key) || key === "e" || key === " " || key === "r" ? key : null;
}
addEventListener("keydown", event => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  if (!event.repeat) startAudio();
  if (event.key === "Escape" || event.key.toLowerCase() === "p") {
    event.preventDefault();
    if (!event.repeat) togglePause();
    return;
  }
  if (elements["game-dialog"].open) {
    const nativeClick = event.target.closest?.("button") && (event.key === "Enter" || event.key === " ");
    if (campaign.panel === "day-intro" && !event.repeat && event.key !== "Tab" && !nativeClick) {
      event.preventDefault();
      campaign.intro = null;
      refreshCampaign();
    }
    return;
  }
  const key = gameKey(event);
  if (!key) return;
  event.preventDefault();
  if (event.repeat) return;
  if (key === "r") restart();
  else { keys.add(key); sendKeys(); }
});
addEventListener("keyup", event => {
  if (keys.delete(event.key.toLowerCase())) sendKeys();
});
addEventListener("blur", releaseKeys);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) releaseKeys();
});
elements.restart.addEventListener("click", restart);
elements["pause-game"].addEventListener("click", togglePause);
for (const button of touchButtons) {
  const key = button.dataset.input;
  button.addEventListener("pointerdown", event => {
    if (event.button !== 0) return;
    event.preventDefault();
    button.setPointerCapture(event.pointerId);
    touches.set(event.pointerId, key);
    button.classList.add("active");
    sendKeys();
  });
  function release(event) {
    if (!touches.delete(event.pointerId)) return;
    button.classList.toggle("active", [...touches.values()].includes(key));
    sendKeys();
  }
  for (const event of ["pointerup", "pointercancel", "lostpointercapture"]) {
    button.addEventListener(event, release);
  }
  button.addEventListener("click", event => {
    if (event.detail !== 0 || keys.has(key)) return;
    keys.add(key);
    sendKeys();
    keys.delete(key);
    sendKeys();
  });
}

const reported = new Set();
function layer(name, draw, onCanvas = false) {
  if (onCanvas) ctx.save();
  try {
    draw();
  } catch (error) {
    if (!reported.has(name)) {
      reported.add(name);
      console.warn("Không thể hiển thị " + name, error);
    }
  } finally {
    if (onCanvas) ctx.restore();
  }
}
async function poll() {
  const generation = pollGeneration;
  try {
    const response = await fetch("/state", { cache: "no-store", signal: AbortSignal.timeout(2000) });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const next = await response.json();
    if (!object(next)) throw new Error("Snapshot phải là object");
    if (generation !== pollGeneration) return;
    snapshot = next;
    const previousMode = mode;
    if (next.mode === "day") {
      if (runMode !== "day") campaign.menu = true;
      runMode = "day";
      if (validMode(next.phase) || next.phase === "shop") mode = next.phase;
    } else if (validMode(next.mode)) {
      runMode = mode = next.mode;
    }
    offline = false;
    if (previousMode && previousMode !== mode) releaseKeys();
    layer("luồng Ngày", refreshCampaign);
    layer("âm thanh", () => playSfx(next));
    if (!sent) sendKeys();
  } catch {
    offline = true;
  } finally {
    layer("HUD", updateHud);
    layer("chỗ HUD che", measureInsets);
    layer("thông báo", updateMessage);
    setTimeout(poll, 33);
  }
}

function node(tag, content, className) {
  const element = document.createElement(tag);
  if (content !== undefined) element.textContent = content;
  if (className) element.className = className;
  return element;
}
function updateContent(element, parts) {
  // Chỉ cập nhật DOM nếu nội dung HUD đổi, không thay cây DOM vô điều kiện mỗi poll.
  const next = node("div");
  next.append(...parts);
  if (element.innerHTML === next.innerHTML) return false;
  element.replaceChildren(...next.childNodes);
  return true;
}
function meter(label, value, fraction, modifier = "") {
  const card = node("div", undefined, "meter" + modifier);
  const title = node("div", undefined, "meter-title");
  const icon = node("span", meterIcons.get(label) ?? "◆", "meter-icon");
  icon.setAttribute("aria-hidden", "true");
  title.append(icon, node("span", label, "label"));
  card.append(title, node("strong", value, "value"));
  if (number(fraction)) card.append(track(fraction));
  return card;
}
const meterIcons = new Map([["Thời gian", "◷"], ["Oxy", "◌"], ["Máu", "♥"], ["Tiền", "◉"],
  ["Tiền ca","◉"], ["Uy tín", "★"], ["Độ sâu","↓"]]);
function track(fraction) {
  const bar = node("div", undefined, "track");
  bar.setAttribute("aria-hidden", "true");
  const fill = node("span", undefined, fraction <= 0.25 ? "fill warn" : "fill");
  fill.style.width = clamp(fraction, 0, 1) * 100 + "%";
  bar.append(fill);
  return bar;
}
function section(title, contents) {
  const result = node("section");
  result.append(node("h2", title), contents);
  return result;
}
function chips(counts, empty) {
  const list = node("ul", undefined, "chips");
  for (const [kind, count] of counts) {
    list.append(node("li", (ingredients.get(kind) ?? kind) + " × " + count, "chip"));
  }
  return list.childElementCount ? list : node("p", empty, "detail");
}
function availableStock(data) {
  const stock = new Map(object(data.stock) ? Object.entries(data.stock).filter(([, amount]) => number(amount) && amount > 0) : []);
  for (const customer of records(data.customers)) {
    if (!object(customer.reserved)) continue;
    for (const [kind, amount] of Object.entries(customer.reserved)) {
      if (!stock.has(kind) || !number(amount) || amount <= 0) continue;
      const remaining = stock.get(kind)-amount;
      if (remaining > 0) stock.set(kind, remaining);
      else stock.delete(kind);
    }
  }
  return stock;
}
function stoveHud(stoves, hz, meta) {
  const list = node("ul");
  for (const stove of stoves) {
    const item = node("li");
    const id = string(stove.id) ? stove.id + " · " : "";
    const status = stoveLabel.get(stove.state) ?? (string(stove.state) ? stove.state : "Chưa có trạng thái");
    const dish = dishId(stove.dish);
    const timer = stove.state === "cooking" && number(stove.cook_ticks_left)
      ? " · " + seconds(stove.cook_ticks_left, hz) + " giây" : "";
    item.append(node("strong", id + status));
    if (dish || timer) item.append(node("div", (dish ? dishName(dish) : "Còn") + timer, "detail"));
    const cookTime = dish && object(meta.menu) ? meta.menu[dish]?.cook_s : null;
    if (stove.state === "cooking" && number(cookTime) && cookTime > 0 && number(stove.cook_ticks_left)) {
      item.append(track(1-stove.cook_ticks_left/(cookTime*hz)));
    }
    list.append(item);
  }
  return list.childElementCount ? list : node("p", "Chưa có dữ liệu bếp.", "detail");
}
function ordersHud(data, meta, hz) {
  const list = node("ul", undefined, "orders");
  for (const customer of records(data.customers)) {
    const dish = dishId(customer);
    const table = string(customer.table_id) ? customer.table_id : null;
    const id = string(customer.id) ? customer.id : null;
    const patience = customer.patience_ticks_left;
    const eating = customer.state === "eating";
    if (!dish && !table && !id && !number(patience) && !eating) continue;
    const fraction = number(patience) && number(meta.patience_s) && meta.patience_s > 0
      ? patience / (hz * meta.patience_s) : null;
    const state = eating ? " eating" : number(fraction) && fraction <= .25 ? " urgent"
      : number(fraction) && fraction <= .5 ? " warn" : "";
    const item = node("li", undefined, "ticket" + state);
    item.dataset.key = JSON.stringify([id, table, dish]);
    const icon = node("canvas");
    icon.width = icon.height = 76;
    icon.dataset.dish = dish ?? "";
    icon.setAttribute("aria-hidden", "true");
    const info = node("div", undefined, "ticket-info");
    info.append(node("strong", dish ? dishName(dish) : "Chưa có món"));
    const detail = node("div", undefined, "ticket-meta");
    detail.append(node("span", [table && "Bàn " + table, id].filter(Boolean).join(" · ") || "Khách"));
    if (eating) detail.append(node("span", "Đang ăn"));
    else if (number(patience)) detail.append(node("span", "Kiên nhẫn " + seconds(patience, hz) + " giây"));
    info.append(detail);
    if (!eating && number(fraction)) info.append(track(fraction));
    item.append(icon, info);
    list.append(item);
  }
  const empty = Array.isArray(data.customers) && !data.customers.length ? "Chưa có khách." : "Chưa có dữ liệu món gọi.";
  return list.childElementCount ? list : node("p", empty, "orders-empty");
}
function updateOrders(data, meta, hz) {
  // Thanh kiên nhẫn đổi mỗi poll: vá phiếu tại chỗ để hiệu ứng (trượt vào, rung) không bị chạy lại liên tục.
  const fresh = ordersHud(data, meta, hz);
  const current = elements.orders.firstElementChild;
  if (current?.tagName === "UL" && fresh.tagName === "UL" && current.children.length === fresh.children.length &&
      [...current.children].every((item, i) => item.dataset.key === fresh.children[i].dataset.key)) {
    [...current.children].forEach((item, i) => {
      const next = fresh.children[i];
      if (item.className !== next.className) item.className = next.className;
      const info = item.querySelector(".ticket-info"), nextInfo = next.querySelector(".ticket-info");
      if (info.innerHTML !== nextInfo.innerHTML) info.replaceWith(nextInfo);
    });
    return;
  }
  if (!updateContent(elements.orders, [fresh])) return;
  for (const icon of elements.orders.querySelectorAll("canvas")) {
    const brush = icon.getContext("2d");
    if (brush) dishArt(brush, icon.dataset.dish, 38, 37, 2.25);

    return plan.dishes.flatMap(item => {
      const id = dishId(item);
      return id ? [[id,object(item) && number(item.count) ? item.count : null]] : [];
    });
  }
  return object(plan.dishes) ? Object.entries(plan.dishes).map(([id,count]) => [id,number(count) ? count : null]) : [];
}
function plannedNeeds(data) {
  return object(data.day_plan?.ingredients)
    ? Object.entries(data.day_plan.ingredients).filter(([,count]) => number(count) && count > 0) : [];
}
function inventoryList(stock) {
  return object(stock) ? Object.entries(stock).filter(([, count]) => number(count) && count > 0) : [];
}
function listOf(items, empty) {
  if (!items.length) return node("p",empty);
  const list = node("ul",undefined,"modal-list");
  list.append(...items.map(text => node("li",text)));
  return list;
}
function statList(entries) {
  const list = node("dl",undefined,"modal-stats");
  for (const [key,value] of entries) list.append(node("dt",key),node("dd",value ?? "—"));
  return list;
}
function action(text,id,primary = false) {
  const button = node("button",text,primary ? "primary" : null);
  button.type = "button";
  button.dataset.action = id;
  return button;
}
function actions(...buttons) {
  const row = node("div",undefined,"modal-actions");
  row.append(...buttons);
  return row;
}
function modalTitle(title) {
  const heading = node("h2",title);
  heading.id = "dialog-title";
  return heading;
}
function dayIntro(data) {
  const items = planDishes(data.day_plan).map(([id,count]) => dishName(id)+(number(count) ? " × "+count : ""));
  return [modalTitle(number(data.day) ? "Ngày "+data.day : "Buổi sáng"),
    node("p","Má Tư dặn Út Sen chuẩn bị:"),listOf(items,"Chưa có kế hoạch món cho Ngày này."),
    actions(action("Bắt đầu lặn hái","continue",true))];
}
function eveningIntro(data,meta) {
  const entries = inventoryList(data.stock);
  const stock = new Map(entries);
  const plan = planDishes(data.day_plan);
  const menu = object(meta.menu) ? meta.menu : {};
  const ids = plan.length ? plan.map(([id]) => id) : Object.keys(menu);
  const cookable = ids.filter(id => object(menu[id]?.recipe) && Object.entries(menu[id].recipe)
    .every(([kind,count]) => number(count) && (stock.get(kind) ?? 0) >= count));
  return [modalTitle("Chuẩn bị mở quán"),
    node("p",object(data.stock) ? "Đã nhập "+entries.reduce((sum,[,qty]) => sum+qty,0)+" nguyên liệu." : "Chưa có dữ liệu nhập kho."),
    chips(entries,"Kho chưa có nguyên liệu."),
    node("h3","Món có thể nấu"),listOf(cookable.map(dishName),"Chưa có món đủ nguyên liệu."),
    actions(action("Mở cửa quán","continue",true))];
}
// meta của Shop có thể không gửi reputation_max: nhớ giá trị gần nhất máy chủ đã gửi.
let knownReputationMax = null;
function reputationMax() {
  const max = fields().meta.reputation_max;
  if (number(max)) knownReputationMax = max;
  return knownReputationMax;
}
// Sao = uy tín thật của quán (làm tròn), tối đa reputation_max trong contract. Không tự đặt ngưỡng điểm.
function stars(value,max) {
  const row = node("div",undefined,"stars");
  if (!number(value) || !number(max) || max <= 0 || max > 10) return node("span");
  const lit = clamp(Math.round(value),0,max);
  row.setAttribute("role","img");
  row.setAttribute("aria-label","Uy tín "+lit+" trên "+max+" sao");
  for (let i = 0; i < max; i++) {
    const star = node("span","★",i < lit ? "on" : undefined);
    star.setAttribute("aria-hidden","true");
    row.append(star);
  }
  return row;
}
function dayResult(data) {
  const stats = dayStats(data.day);
  const end = object(data.day_result) ? data.day_result : stats.end ?? {};
  const count = (key,fallback) => number(end[key]) ? end[key] : stats.complete ? fallback : null;
  const income = number(end.shift_earned) ? end.shift_earned : stats.complete ? stats.income : null;
  const delta = number(end.reputation_delta) ? end.reputation_delta :
    number(stats.startReputation) && number(end.reputation) ? end.reputation-stats.startReputation : null;
  const reputation = number(end.reputation) ? end.reputation : data.reputation;
  return [modalTitle(number(data.day) ? "Kết quả Ngày "+data.day : "Kết quả buổi tối"),
    stars(reputation,reputationMax()), statList([
    ["Khách đã phục vụ",count("served",stats.served)],["Khách bỏ đi",count("left",stats.left)],
    ["Tiền ca",moneyLabel(income)],["Tiền boa",moneyLabel(count("tips",stats.tips))],
    ["Thay đổi uy tín",number(delta) ? (delta > 0 ? "+" : "")+delta.toLocaleString("vi-VN",{maximumFractionDigits:2}) : null]
  ]),actions(action("Đến cửa hàng","continue",true))];
}
function summary(data) {
  const best = [...campaign.sales].sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]))[0];
  const reportedBest = dishId(data.summary?.best_seller);
  return [modalTitle(number(data.days_completed) ? "Đã xong "+data.days_completed+" Ngày" : "Tổng kết hành trình"),
    stars(data.reputation,reputationMax()), statList([["Tổng tiền kiếm được",moneyLabel(data.earned)],["Tiền còn lại",moneyLabel(data.money)],["Tổng điểm",number(data.score) ? data.score : null],
      ["Uy tín",number(data.reputation) ? data.reputation.toLocaleString("vi-VN",{maximumFractionDigits:2}) : null],
      ["Món bán chạy",reportedBest ? dishName(reportedBest) : best ? dishName(best[0])+" × "+best[1] : null]]),
    actions(action("Về menu","menu",true))];
}
const upgradeNames = new Map([["oxygen","Bình oxy"],["hp","Áo phao"]]);
const buyErrors = new Map([["funds","Không đủ tiền."],["max_level","Đã đạt cấp cao nhất."],
  ["unknown","Cửa hàng không có nâng cấp này."],["out_of_stock","Mặt hàng đã hết."]]);
function shop(data,meta,hz) {
  const grid = node("div",undefined,"shop-grid");
  const upgrades = object(meta.shop?.upgrades) ? meta.shop.upgrades : {};
  for (const [id,name] of upgradeNames) {
    const level = levelOf(data.upgrades?.[id]);
    const next = records(upgrades[id]).find(item => item.level === level+1 && number(item.price));
    const card = node("div",undefined,"shop-item");
    card.append(node("strong",name),node("span","Cấp hiện tại: "+level));
    if (next) {
      const effect = id === "oxygen" && number(next.oxygen_max_s) ? " · "+next.oxygen_max_s+" giây oxy"
        : id === "hp" && number(next.hp_max) ? " · "+next.hp_max+" máu" : "";
      const buy = action("Mua "+name,"buy:"+id);
      buy.disabled = data.state === "paused";
      card.append(node("span","Cấp "+next.level+" · "+moneyLabel(next.price)+effect));
      if (number(data.money) && data.money < next.price) {
        // Vẫn cho bấm để máy chủ trả lời "Không đủ tiền.", nhưng báo trước số còn thiếu.
        buy.classList.add("poor");
        card.append(node("span","Còn thiếu "+moneyLabel(next.price-data.money),"shortfall"));
      }
      card.append(buy);
    } else {
      card.append(node("span",Array.isArray(upgrades[id]) ? "Đã đạt cấp tối đa." : "Chưa có bảng giá."));
    }
    grid.append(card);
  }
  const elapsed = number(data.tick) && number(data.phase_tick) ? data.tick-data.phase_tick : -Infinity;
  const receipt = records(data.events).findLast(event =>
    (event.name === "buy_failed" || event.name === "bought") &&
    (number(event.day) ? event.day === data.day : number(event.tick) && event.tick >= elapsed));
  const feedback = receipt?.name === "buy_failed" ? buyErrors.get(receipt.data?.reason) ?? "Chưa mua được nâng cấp."
    : receipt?.name === "bought" ? "Đã mua "+(upgradeNames.get(receipt.data?.upgrade) ?? "nâng cấp")+". Có hiệu lực từ Ngày sau." : "";
  const notice = node("p",feedback,receipt?.name === "bought" ? "shop-feedback success" : "shop-feedback");
  notice.hidden = !feedback;
  notice.setAttribute("role","status");
  const done = action("Xong","shop-done",true);
  done.disabled = data.state === "paused";
  return [modalTitle("Cửa hàng cuối Ngày"),
    node("p","Còn "+time(data.time_left_ticks,hz)+" · Tiền: "+moneyLabel(data.money)),grid,notice,
    actions(done,action("Tạm dừng","pause"))];
}

function panelContent(panel,data,meta,hz) {
  switch (panel) {
    case "exit":
      return [modalTitle("Đã về màn hình chờ"),node("p","Bạn có thể đóng tab này hoặc quay lại menu."),
        actions(action("Quay lại","menu",true))];
    case "menu": {
      const card = node("div",undefined,"title-card");
      card.append(node("p","Quán Ăn Chợ Nổi","eyebrow"),modalTitle(runMode === "day" ? "Một ngày cùng Út Sen" : "Menu chính"),
        node("p","Sáng lặn sông hái bông, bắt cá. Tối mở quán nấu cho kịp khách."),
        actions(action("Chơi","play",true),action("Cài đặt","settings"),action("Thoát","exit")));
      return [card];
    }
    case "pause":
      return [modalTitle("Tạm dừng"),
        actions(action("Tiếp tục","resume",true),action("Cài đặt","settings"),action("Về menu","menu"))];
    case "settings": return audioSettings();
    case "day-intro": return dayIntro(data);
    case "evening-intro": return eveningIntro(data,meta);
    case "day-result": return dayResult(data);
    case "shop": return shop(data,meta,hz);
    case "summary": return summary(data);
    default: return [];
  }
}
function renderDialog(panel,data,meta,hz) {
  const dialog = elements["game-dialog"];
  const previous = campaign.panel;
  campaign.panel = panel;
  if (!panel) {
    if (dialog.open) dialog.close();
    return;
  }
  const focused = dialog.contains(document.activeElement) ? document.activeElement.dataset.action : null;
  if (panel !== "settings" || previous !== panel || !dialog.open) {
    if (updateContent(dialog,panelContent(panel,data,meta,hz)) && focused && previous === panel) {
      [...dialog.querySelectorAll("[data-action]")].find(button => button.dataset.action === focused)?.focus();
    }
  }
  if (!dialog.open) {
    dialog.showModal();
    releaseKeys();
  } else if (previous !== panel) {
    dialog.querySelector("button")?.focus();
  }
}
function refreshCampaign() {
  if (!snapshot || campaign.starting) return;
  const { data,meta,hz } = fields();
  document.body.dataset.run = runMode ?? "";
  const done = data.finished === true || data.state === "finished";
  if (runMode === "day" && mode) {
    recordDay(data);
    const key = String(data.day)+":"+mode;
    if (key !== campaign.lastPhase) {
      const before = campaign.lastPhase;
      campaign.lastPhase = key;
      if (!campaign.menu && !done) {
        if (mode === "gather") campaign.intro = { panel:"day-intro", until:performance.now()+4000 };
        else if (mode === "quan") campaign.intro = { panel:"evening-intro" };
        else if (mode === "shop" && before?.endsWith(":quan")) campaign.intro = { panel:"day-result" };
      }
    }
  }
  if (campaign.intro?.until && performance.now() >= campaign.intro.until) campaign.intro = null;
  reconcilePause(data);
  const panel = campaign.settings ? "settings" : campaign.menu ? campaign.exited ? "exit" : "menu"
    : campaign.userPause ? "pause" : done && runMode === "day" ? "summary"
    : campaign.intro?.panel ?? (mode === "shop" && !done ? "shop" : null);
  renderDialog(panel,data,meta,hz);
}
elements["game-dialog"].addEventListener("cancel",event => {
  event.preventDefault();
  togglePause();
});
elements["game-dialog"].addEventListener("click",event => {
  const id = event.target.closest("button")?.dataset.action;
  if (!id) return;
  startAudio();
  if (id === "play") {
    restart();
    return;
  } else if (id === "exit" || id === "menu") {
    campaign.exited = id === "exit";
    campaign.menu = true;
    campaign.userPause = false;
    campaign.intro = null;
  } else if (id === "settings") campaign.settings = true;
  else if (id === "settings-back") campaign.settings = false;
  else if (id === "resume") campaign.userPause = false;
  else if (id === "continue") campaign.intro = null;
  else if (id === "pause") togglePause();
  else if (id === "shop-done" && campaign.panel === "shop" && snapshot?.state !== "paused") pulse("shop_done");
  else if (campaign.panel === "shop" && snapshot?.state !== "paused" && id.startsWith("buy:")) {
    const upgrade = id.slice(4);
    if (upgradeNames.has(upgrade)) command({ buy:upgrade });
  }
  refreshCampaign();
});

const soundKey = "chonoi.audio.v1";
const soundChannels = new Map([["master","Âm lượng chung (Master)"],["music","Nhạc nền (Music)"],["sfx","Hiệu ứng (SFX)"]]);
const sound = { master:.6, music:.24, sfx:.64 };
try {
  const saved = JSON.parse(localStorage.getItem(soundKey));
  if (object(saved)) for (const key of soundChannels.keys()) {
    if (number(saved[key])) sound[key] = clamp(saved[key],0,1);
  }
} catch { /* vắng bộ lưu trữ, giữ mức mặc định */ }
let audio = null;
let beat = 0;
function applySound() {
  if (audio) for (const key of soundChannels.keys()) {
    audio[key].gain.setTargetAtTime(sound[key],audio.context.currentTime,.025);
  }
}
function note(bus,hz,volume,length,type = "triangle",delay = 0,slideTo = null) {
  const { context } = audio;
  const oscillator = context.createOscillator();
  const gain = context.createGain();
  const now = context.currentTime+delay;
  oscillator.type = type;
  oscillator.frequency.setValueAtTime(hz,now);
  if (slideTo) oscillator.frequency.exponentialRampToValueAtTime(slideTo,now+length);
  gain.gain.setValueAtTime(0,now);
  gain.gain.linearRampToValueAtTime(volume,now+.012);
  gain.gain.exponentialRampToValueAtTime(.001,now+length);
  oscillator.connect(gain).connect(audio[bus]);
  oscillator.start(now);
  oscillator.stop(now+length+.01);
}
function startAudio() {
  if (!audio && typeof AudioContext === "function") {
    try {
      const context = new AudioContext();
      audio = { context, master:context.createGain(), music:context.createGain(), sfx:context.createGain() };
      audio.music.connect(audio.master);
      audio.sfx.connect(audio.master);
      audio.master.connect(context.destination);
      applySound();
    } catch { return; }
  }
  if (audio?.context.state === "suspended") void audio.context.resume().catch(() => {});
}
function audioSettings() {
  const form = node("div");
  for (const [key,title] of soundChannels) {
    const row = node("label",undefined,"setting-row");
    const slider = node("input");
    slider.id = "volume-"+key;
    slider.type = "range";
    slider.min = "0";
    slider.max = "100";
    slider.value = String(Math.round(sound[key]*100));
    slider.setAttribute("value",slider.value);
    slider.dataset.volume = key;
    const value = node("output",slider.value+"%");
    value.id = "value-"+key;
    value.htmlFor = slider.id;
    row.append(node("span",title),value,slider);
    form.append(row);
  }
  return [modalTitle("Âm thanh"),form,actions(action("Quay lại","settings-back",true))];
}
elements["game-dialog"].addEventListener("input",event => {
  const key = event.target.dataset.volume;
  if (!soundChannels.has(key)) return;
  sound[key] = Number(event.target.value)/100;
  try { localStorage.setItem(soundKey,JSON.stringify(sound)); } catch { /* chỉ lưu trong lượt */ }
  document.getElementById("value-"+key).textContent = event.target.value+"%";
  applySound();
});
// Mỗi sự kiện một tiếng riêng để người chơi "nghe" được bếp mà không cần nhìn.
const sfxBank = {
  gather: () => { note("sfx",660,.2,.12); note("sfx",990,.18,.16,"triangle",.07); },
  fish_caught: () => { note("sfx",520,.22,.1,"square"); note("sfx",780,.2,.1,"square",.06); note("sfx",1040,.16,.18,"triangle",.12); },
  hold_full: () => { note("sfx",220,.2,.12,"square"); note("sfx",220,.2,.12,"square",.16); },
  dive: () => note("sfx",700,.16,.3,"sine",0,180),
  surface: () => note("sfx",200,.16,.3,"sine",0,760),
  monster_hit: () => { note("sfx",140,.32,.35,"sawtooth",0,60); },
  choke: () => note("sfx",180,.26,.3,"sawtooth",0,90),
  faint: () => { note("sfx",392,.24,.25,"triangle",0,196); note("sfx",294,.24,.4,"triangle",.22,130); },
  customer_arrived: () => { note("sfx",880,.12,.08); note("sfx",1175,.12,.1,"triangle",.07); },
  cook_started: () => note("sfx",320,.14,.18,"sawtooth",0,240),
  dish_ready: () => { note("sfx",1568,.22,.5,"sine"); note("sfx",2093,.14,.6,"sine",.03); },
  dish_picked: () => note("sfx",600,.16,.1,"triangle",0,900),
  served: () => [523,659,784].forEach((hz,i) => note("sfx",hz,.18,.16,"triangle",i*.06)),
  paid: () => { note("sfx",988,.18,.08,"square"); note("sfx",1319,.18,.28,"square",.08); },
  customer_left: () => note("sfx",260,.24,.45,"sawtooth",0,110),
  bought: () => [523,659,784,1047].forEach((hz,i) => note("sfx",hz,.18,.18,"triangle",i*.07)),
  buy_failed: () => note("sfx",160,.22,.25,"square")
};
const shakeEvents = new Set(["monster_hit","choke","faint"]);
const heardEvents = new Set();
function playSfx(data) {
  const hz = tickHz(fields().meta);
  const fresh = records(data.events).filter(event => {
    if (!number(event.tick) || !number(data.tick) || data.tick-event.tick > hz) return false;
    const key = JSON.stringify([event.day,event.tick,event.name,event.data?.order_id ?? event.data?.fish_id ?? event.data?.node_id]);
    if (heardEvents.has(key)) return false;
    heardEvents.add(key);
    if (heardEvents.size > 400) heardEvents.delete(heardEvents.values().next().value);
    return true;
  });
  if (!fresh.length || data.state === "paused") return;
  if (fresh.some(event => shakeEvents.has(event.name)) && !reduceMotion.matches) {
    const stage = elements["game-stage"];
    stage.classList.remove("hit");
    void stage.offsetWidth; // chạy lại hiệu ứng rung
    stage.classList.add("hit");
  }
  if (!audio || audio.context.state !== "running") return;
  for (const name of new Set(fresh.map(event => event.name))) sfxBank[name]?.();
}
// Nhạc nền ngũ cung (cung Bắc) — tăng gấp đôi nhịp khi gần hết giờ, như cảnh "chạy deadline" trong bếp.
const melody = [523.25,587.33,698.46,783.99,880,783.99,698.46,587.33,523.25,698.46,783.99,1046.5,880,783.99,587.33,698.46];
const bass = [130.81,174.61,196,130.81];
setInterval(() => {
  if (!audio || audio.context.state !== "running" || !snapshot || snapshot.state === "paused" ||
      snapshot.finished || document.hidden || elements["game-dialog"].open) return;
  const { data, hz } = fields();
  const rush = number(data.time_left_ticks) && seconds(data.time_left_ticks,hz) <= (mode === "gather" ? 30 : 20);
  const step = beat++;
  if (!rush && step % 2) return;
  const i = rush ? step : step/2;
  note("music",melody[i % melody.length],.09,.22);
  if (i % 4 === 0) note("music",bass[(i/4) % bass.length],.12,.4,"sine");
},180);
void poll();
requestAnimationFrame(frame);
</script>
